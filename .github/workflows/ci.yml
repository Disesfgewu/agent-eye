name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (extension + bundled MCP server)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium + system deps (Linux)
        run: npx --yes playwright install --with-deps chromium
      - name: E2E browser smoke test (drives a real headless browser on Linux)
        working-directory: packages/mcp-server
        run: node e2e-browser.mjs
      - name: E2E CDP attach (the agent must not touch a browser's other tabs)
        working-directory: packages/mcp-server
        run: node e2e-cdp.mjs
      - name: Package the .vsix
        working-directory: packages/vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: agent-eye-vsix
          path: packages/vscode-extension/*.vsix

  e2e-engines:
    name: e2e (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install ${{ matrix.engine }} + system deps
        run: npx --yes playwright install --with-deps ${{ matrix.engine }}
      - name: E2E smoke test on ${{ matrix.engine }}
        working-directory: packages/mcp-server
        env:
          AGENT_EYE_BROWSER: ${{ matrix.engine }}
        run: node e2e-browser.mjs

  e2e-toolchains:
    name: e2e (Go, Rust, Python, Node dev servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: npm ci
      - run: npm run build
      - name: Toolchain versions
        run: |
          go version
          cargo --version
          python3 --version
      - name: detect_project + start_dev_server against real toolchains
        working-directory: packages/mcp-server
        env:
          AGENT_EYE_REQUIRE_TOOLCHAINS: go,cargo,python
        run: node e2e-toolchains.mjs

  python-tests:
    name: python (${{ matrix.python }})
    # 24.04, not ubuntu-latest: setup-python has no 3.9 build for 26.04, and 3.9 is our declared minimum.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Conformance + dev-server + real-browser smoke tests
        working-directory: packages/python
        env:
          PYTHONPATH: src
          AGENT_EYE_REQUIRE_PLAYWRIGHT: "1"
        run: python -m unittest discover -s tests -v

  windows:
    name: unit tests (windows)
    # dev servers are spawned through cmd.exe on Windows: that path is only exercised here (Issue #27)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Python unit tests
        working-directory: packages/python
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
